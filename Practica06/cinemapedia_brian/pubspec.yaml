name: cinemapedia
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  dio: ^5.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^5.0.2
  flutter_riverpod: ^2.2.0
  go_router: ^6.0.9
  intl: ^0.20.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/cinemapedia.png"
  adaptive_icon_background: "#090D25"
  adaptive_icon_foreground: "assets/icon/cinemapedia_foreground.png"
  adaptive_icon_foreground_inset: 0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
